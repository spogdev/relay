pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
    plugins {
        // Declared here so subprojects can apply the plugin without repeating the version.
        id 'net.fabricmc.fabric-loom' version '1.17.11'
    }
}
rootProject.name = 'TeamLocator'

// The relay is a standalone, headless WebSocket service (no Minecraft / no Fabric Loom).
// It lives in the same repo so it can reuse the mod's trust-routing logic and protocol shapes.
include 'relay'

// Relay Spectate: an optional addon mod. Separate jar so a user can run Relay without it; it
// depends on Relay for the trust list and relay connection and adds nothing to the base mod.
include 'spectate'

// The spectate addon's routing service. A separate process from the main relay so a bug in the
// (much heavier) stream forwarding cannot take down position and alert routing.
include 'spectate-relay'
