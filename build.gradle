plugins {
    // Minecraft 26.1+ uses the new Loom plugin id. Nothing is remapped (the game is
    // unobfuscated and ships official mappings), so there is no 'mappings' dependency
    // and no remapJar task — 'jar' produces the final artifact.
    id 'net.fabricmc.fabric-loom' version '1.17.11'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Mod Menu and Xaero's both come from Modrinth, which is already the source of truth for the
    // Xaero builds. Mod Menu's own maven (maven.terraformersmc.com) is not used: it has been seen
    // truncating jars mid-transfer — advertising the full Content-Length, then closing the
    // connection early, so every download fails identically and the build cannot proceed. It
    // serves the byte-identical artifact when healthy, so there is nothing to lose by not
    // depending on it.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // SporeUI, the shared config UI. One artifact per Minecraft version, so
    // each branch of this mod depends on the matching one.
    maven {
        name = 'Spog'
        url = 'https://repo.spog.dev/releases'
        content {
            includeGroup 'dev.spog'
        }
    }
}

/**
 * XaeroLib, extracted from the minimap's META-INF/jars.
 *
 * <p>It is fetched through its own configuration rather than read off compileClasspath: that
 * configuration is where the extracted jar is then added, so resolving it here to produce that jar
 * is circular. A provider keeps the download lazy -- it only runs when compilation asks for the file.
 */
configurations { xaeroLibSource }

dependencies {
    xaeroLibSource "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
}

def xaeroLibJar = provider {
    def out = layout.buildDirectory.file("xaerolib/xaerolib.jar").get().asFile
    if (!out.exists()) {
        def minimap = configurations.xaeroLibSource.files.find { it.name.startsWith('xaeros-minimap') }
        out.parentFile.mkdirs()
        out.bytes = zipTree(minimap).matching { include 'META-INF/jars/xaerolib-*.jar' }.singleFile.bytes
    }
    out
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Depend on the full Fabric API; per-module fabricApi.module(...) pulls are brittle in 26.1.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    api("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }

    // The shared config UI: the tabbed settings screen and its widgets, which
    // this mod's settings screen is built from. Bundled with `include` so a
    // player installs this mod alone -- it is a library nobody would think to
    // install separately, and it is small.
    //
    // ModMenu comes through it transitively, hence `transitive = false` here
    // as well: without it the two ModMenu declarations fight over versions.
    implementation("dev.spog:sporeui:${project.sporeui_version}") { transitive = false }
    include("dev.spog:sporeui:${project.sporeui_version}")

    // Optional integration: teammates on Xaero's minimap/world map. compileOnly so the mod
    // runs fine without them; all xaero.* references live behind a mod-loaded guard.
    compileOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
    compileOnly "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"

    // XaeroLib carries the types Xaero's own renderer signatures now name (XaeroBufferProvider),
    // so the mixins need it at compile time. It ships only as a jar-in-jar inside the two mods
    // above and is not published to Modrinth on its own, so it is unpacked from one of them rather
    // than declared as a coordinate. compileOnly like its parents: at runtime Xaero loads it.
    compileOnly files(xaeroLibJar)
}


processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// A client gametest that opens the settings screen and paints every tab in a
// real client. The screen is drawn inside extractRenderState, which the
// compiler checks and never runs, so this is what actually proves the port
// works rather than merely compiles.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "relay-gametest"
        enableClientGameTests = true
        // A client mod: there is no server behaviour to test.
        enableGameTests = false
    }
}

dependencies {
    // Fabric API on the gametest source set's own classpath: the test is
    // driven by fabric-client-gametest-api-v1. Nothing is remapped on 26.x,
    // so this is the plain configuration.
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
