org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties for Minecraft 1.21.11.
# 1.21.x is obfuscated: unlike the 26.1 branch this build needs yarn mappings and remaps
# its output, so remapJar (not jar) produces the publishable artifact.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.5+1.21.11
modmenu_version=17.0.0

# Latest Xaero's builds for 1.21.11 (compileOnly; the mod runs fine without them).
xaero_minimap_version=fabric-1.21.11-26.3.0
xaero_worldmap_version=fabric-1.21.11-1.43.0

# Mod properties
mod_version=0.1.0
maven_group=dev.spog
archives_base_name=relay
