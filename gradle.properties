org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties for Minecraft 26.2.
# 26.1+ is unobfuscated and uses Mojang's official mappings — there is no yarn_mappings property.
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.158.0+26.2
modmenu_version=20.0.3

# Xaero's builds for 26.2 (compileOnly; the mod runs fine without them).
xaero_minimap_version=fabric-26.2-26.5.1
xaero_worldmap_version=fabric-26.2-1.46.1

# Mod properties
mod_version=0.3.2
maven_group=dev.spog
archives_base_name=relay

# Relay Spectate addon (separate jar, versioned independently of Relay).
spectate_version=0.1.0
sporeui_version=0.4.4+26.2
