plugins {
    // Loom 1.12.x, NOT the 1.17.x the 26.1 branch uses: 1.17 is built for the unobfuscated
    // toolchain and has no mappings() at all, so it cannot consume yarn. 1.21.x is obfuscated,
    // so this build maps against yarn and 'remapJar' produces the publishable artifact.
    id 'fabric-loom' version '1.16.3'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// A client gametest that opens the settings screen and paints every tab in a
// real client. The screen is drawn inside render(), which the compiler checks
// and never runs, so this is what actually proves the port works rather than
// merely compiles. Loom creates the `gametest` source set and run config;
// neither is part of the published jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "relay-gametest"
        enableClientGameTests = true
        // A client mod: there is no server behaviour to test, and `check`
        // would otherwise launch a dedicated server with nothing to run.
        enableGameTests = false
    }
}

repositories {
    mavenCentral()
    // Mod Menu and Xaero's both come from Modrinth. Mod Menu's own maven
    // (maven.terraformersmc.com) is not used: it currently truncates the jar mid-transfer —
    // it advertises the full Content-Length, then closes the connection early, so every
    // download fails the same way. Modrinth serves the identical artifact intact.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // SporeUI, the shared config UI. One artifact per Minecraft version, so
    // each branch of this mod depends on the matching one.
    maven {
        name = 'Spog'
        url = 'https://repo.spog.dev/releases'
        content {
            includeGroup 'dev.spog'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // The obfuscated game needs a mapping set to compile against; the 26.1 branch has no
    // equivalent line because it ships Mojang's names already.
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Depend on the full Fabric API; per-module fabricApi.module(...) pulls are brittle.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }

    // The shared config UI: the tabbed settings screen and its widgets, which
    // this mod's settings screen is built from. Bundled with `include` so a
    // player installs this mod alone -- it is a library nobody would think to
    // install separately, and it is small.
    //
    // ModMenu comes through it transitively, hence `transitive = false` here
    // as well: without it the two ModMenu declarations fight over versions.
    modImplementation("dev.spog:sporeui:${project.sporeui_version}") { transitive = false }
    include("dev.spog:sporeui:${project.sporeui_version}")

    // Optional integration: teammates on Xaero's minimap/world map. modCompileOnly so the mod
    // runs fine without them; all xaero.* references live behind a mod-loaded guard.
    modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
    modCompileOnly "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// 1.21.11 targets Java 21, not the 25 the 26.1 branch uses.
def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

dependencies {
    // Fabric API on the gametest source set's own classpath: the test is
    // driven by fabric-client-gametest-api-v1. Remapped, like the mod itself.
    modGametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
