plugins {
    // Same Loom plugin and version as the root mod: this module is a second Fabric mod jar built
    // against the same unobfuscated Minecraft, so nothing is remapped and 'jar' is the artifact.
    id 'net.fabricmc.fabric-loom'
}

version = "${project.spectate_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = 'spegtate'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // No dependency on Relay, by design: the addon keeps its own trust list, service address and
    // keybind-name window, and runs with or without it. The one place Relay is still named --
    // the first-run settings import in SpectateRelayImport -- reaches it reflectively, precisely
    // so that an absent Relay is a quiet no-op rather than a NoClassDefFoundError at launch.
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_spegtate" }
    }
}

// Prints the module's full compile classpath, for ad-hoc experiments against the game's own
// codecs outside the mod (see docs/spectate-testing.md).
tasks.register('printCp') {
    doLast { println sourceSets.main.compileClasspath.asPath }
}
